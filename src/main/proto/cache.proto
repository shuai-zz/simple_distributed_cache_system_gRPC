syntax = "proto3";

package cache;

service CacheService {
  rpc Put (PutRequest) returns (PutResponse);
  rpc Get (GetRequest) returns (GetResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);
}

message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  bool ok = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  string value = 1;
  bool exists = 2;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  int32 deleted = 1;
}
